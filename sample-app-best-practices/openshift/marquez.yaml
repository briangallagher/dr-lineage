apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marquez-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez-db
  labels:
    app.kubernetes.io/name: marquez-db
    app.kubernetes.io/part-of: openlineage-best-practices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marquez-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marquez-db
        app.kubernetes.io/part-of: openlineage-best-practices
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          envFrom:
            - secretRef:
                name: marquez-db-credentials
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: [/bin/sh, -c, pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [/bin/sh, -c, pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marquez-db
---
apiVersion: v1
kind: Service
metadata:
  name: marquez-db
spec:
  selector:
    app.kubernetes.io/name: marquez-db
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marquez-config
data:
  marquez.yml: |
    server:
      applicationConnectors:
        - type: http
          port: 5000
          httpCompliance: RFC7230_LEGACY
      adminConnectors:
        - type: http
          port: 5001
    db:
      driverClass: org.postgresql.Driver
      url: jdbc:postgresql://marquez-db:5432/marquez
      user: marquez
      password: ${MARQUEZ_DB_PASSWORD}
    migrateOnStartup: true
    logging:
      level: INFO
      appenders:
        - type: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez
  labels:
    app.kubernetes.io/name: marquez
    app.kubernetes.io/part-of: openlineage-best-practices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marquez
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marquez
        app.kubernetes.io/part-of: openlineage-best-practices
    spec:
      containers:
        - name: marquez
          image: docker.io/marquezproject/marquez:0.50.0
          env:
            - name: MARQUEZ_CONFIG
              value: /usr/src/app/marquez.yml
            - name: MARQUEZ_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marquez-db-credentials
                  key: POSTGRESQL_PASSWORD
          ports:
            - name: http
              containerPort: 5000
            - name: admin
              containerPort: 5001
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: admin
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /usr/src/app/marquez.yml
              subPath: marquez.yml
      volumes:
        - name: config
          configMap:
            name: marquez-config
---
apiVersion: v1
kind: Service
metadata:
  name: marquez
spec:
  selector:
    app.kubernetes.io/name: marquez
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: admin
      port: 5001
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez-web
  labels:
    app.kubernetes.io/name: marquez-web
    app.kubernetes.io/part-of: openlineage-best-practices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marquez-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marquez-web
        app.kubernetes.io/part-of: openlineage-best-practices
    spec:
      containers:
        - name: marquez-web
          image: docker.io/marquezproject/marquez-web:0.50.0
          env:
            - name: MARQUEZ_HOST
              value: marquez
            - name: MARQUEZ_PORT
              value: "80"
            - name: WEB_PORT
              value: "3000"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: marquez-web
spec:
  selector:
    app.kubernetes.io/name: marquez-web
  ports:
    - name: http
      port: 80
      targetPort: http

