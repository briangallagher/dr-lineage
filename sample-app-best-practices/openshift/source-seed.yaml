apiVersion: batch/v1
kind: Job
metadata:
  name: object-store-seed
  labels:
    app.kubernetes.io/part-of: openlineage-best-practices
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store-seed
        app.kubernetes.io/part-of: openlineage-best-practices
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/ol-best-practices/lineage-demo-app:latest
          imagePullPolicy: Always
          command: [python, -m, lineage_demo.seed]
          args: [--file, /seed/source-v1.csv]
          envFrom:
            - secretRef:
                name: object-store-credentials
          env:
            - name: S3_ENDPOINT
              value: http://minio:9000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: source-data
              mountPath: /seed
      volumes:
        - name: source-data
          configMap:
            name: source-data
