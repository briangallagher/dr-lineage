apiVersion: batch/v1
kind: Job
metadata:
  name: object-store-seed
  labels:
    app.kubernetes.io/part-of: openlineage-best-practices
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: object-store-seed
        app.kubernetes.io/part-of: openlineage-best-practices
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: docker.io/minio/mc@sha256:993e8c454a7ec632923f7e3e61adf1d473261da6354cefd641aedd33a2cfe112
          command: [/bin/sh, -eu, -c]
          args:
            - |
              mc alias set local http://minio:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
              mc mb --ignore-existing local/sample-data
              mc mb --ignore-existing local/pipeline-artifacts
              mc version suspend local/sample-data || true
              mc cp /seed/source-v1.csv local/sample-data/raw/documents.csv
              mc ilm rule add --expire-days 7 --prefix staging/ local/sample-data || true
          envFrom:
            - secretRef:
                name: object-store-credentials
          env:
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          volumeMounts:
            - name: source-data
              mountPath: /seed
      volumes:
        - name: source-data
          configMap:
            name: source-data
