apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: openlineage-best-practices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: openlineage-best-practices
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          envFrom:
            - secretRef:
                name: object-store-credentials
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: source-data
data:
  source-v1.csv: |
    title,category,text
    OpenLineage introduction,lineage,OpenLineage records metadata about data processing jobs
    Data Registry asset,registry,A registry record gives a logical identity and storage pointer
    Spark transformation,processing,Spark reads staged data and writes normalized parquet output
  source-v2.csv: |
    title,category,text
    OpenLineage introduction,lineage,OpenLineage reports metadata from instrumented producers
    Data Registry asset,registry,A registry UUID identifies metadata but not immutable source bytes
    Spark transformation,processing,Spark creates a separately identified transformed dataset
    Bypass update,limitation,This row appeared through an uninstrumented direct object overwrite
