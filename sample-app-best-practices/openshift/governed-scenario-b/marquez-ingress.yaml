# Permit only KFP task pods in scenario-b to deliver events to the dedicated
# Marquez receiver. The pod destination is port 5000 behind Service port 80.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scenario-b-governed-kfp
  namespace: ol-best-practices
  labels:
    app.kubernetes.io/part-of: lineage-governed-trial
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marquez
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: scenario-b
          podSelector:
            matchExpressions:
              - key: pipeline/runid
                operator: Exists
      ports:
        - protocol: TCP
          port: 5000
