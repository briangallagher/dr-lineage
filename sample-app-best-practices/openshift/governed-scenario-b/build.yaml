# Binary build from the local, unpushed Slice 2 fixture source tree.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: lineage-governed-app
  namespace: scenario-b
  labels:
    app.kubernetes.io/part-of: lineage-governed-trial
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: lineage-governed-app
  namespace: scenario-b
  labels:
    app.kubernetes.io/part-of: lineage-governed-trial
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile.app
  output:
    to:
      kind: ImageStreamTag
      name: lineage-governed-app:latest
  triggers: []
