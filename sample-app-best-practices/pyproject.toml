[project]
name = "rhoai-openlineage-best-practices"
version = "0.1.0"
description = "OpenLineage and RHOAI Data Registry learning application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3==1.40.39",
  "fastapi==0.117.1",
  "httpx==0.28.1",
  "kfp==2.16.1",
  "kfp-kubernetes==2.16.1",
  "kubernetes==30.1.0",
  "openlineage-python==1.53.0",
  "pyarrow==21.0.0",
  "pydantic-settings==2.10.1",
  "uvicorn==0.36.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema==4.25.1",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.1",
]

[project.scripts]
lineage-demo = "lineage_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineage_demo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
